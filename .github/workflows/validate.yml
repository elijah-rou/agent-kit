name: Validate
on:
  push:
  workflow_dispatch:
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.2'
      - name: Install ripgrep, zsh, and the pinned Claude Code CLI
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then sudo apt-get update && sudo apt-get install --yes ripgrep zsh; else brew list ripgrep >/dev/null 2>&1 || brew install ripgrep; fi
          bun install --global --exact @anthropic-ai/claude-code@2.1.285
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
      - name: Install the locked dependencies
        run: bun install --frozen-lockfile
      - run: scripts/validate
