# The rule-to-enforcer table: one [[rule]] row per rule, in the format skills/correct/SKILL.md defines.
# pr-review applies every row with level = "review" to every change.

[[rule]]
id = "standalone-kit"
statement = "agent-kit's code, skills, tests, and current docs name no installer, name no other project of the owner's except the agent runtimes, T3 Code, and the tools and services the kit calls, and hold no machine-specific path; license attribution, provenance, and dated records are exempt."
level = "review"
enforcer = "pr-review"
proof = "session 9ee0077e's correction (2026-10-14), which asked that agent-kit stand alone of its installer; PR #57's round-1 review (claude-opus-5-5) found what no pattern catches: another of the owner's projects, a Pi runtime for T3, named in three design docs, and a Projects checkout path built in code with homedir() in agentic/tools/upstream-drift/cli.ts"

[[rule]]
id = "standalone-kit-literals"
statement = "Outside the exempt paths scripts/check-standalone.ts lists, no tracked file holds a literal the check refuses: the installer's project name, the name of the owner's configuration repository, a Projects checkout path under the home directory, or an owner repository other than agent-kit."
level = "check"
enforcer = "bun scripts/check-standalone.ts (run by scripts/validate)"
proof = "on trunk 1cb005b, before PR #57, bun scripts/check-standalone.ts from PR #57 exits 1 with 82 findings naming the installer and the owner's configuration repository; on PR #57's head it exits 0"
